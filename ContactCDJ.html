    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #eef3fa; font-family: Arial, Helvetica, sans-serif;
      display: flex; justify-content: center; padding: 76px 12px 24px;
    }
    .back-button {
      position: fixed; top: 14px; right: 14px; z-index: 10;
      display: inline-flex; align-items: center; gap: 8px;
      border: 0; border-radius: 999px; padding: 12px 18px;
      background: #124b9a; color: white; font-size: 15px;
      font-weight: 700; text-decoration: none; cursor: pointer;
      box-shadow: 0 4px 14px rgba(12, 39, 83, .22);
    }
    .back-button:hover { background: #0b3672; }
    .back-button:focus-visible { outline: 3px solid #f5c400; outline-offset: 3px; }
    main { width: min(100%, 1000px); }

    /* ------------------------------------------------------------------
       L'affiche contactCDJ.png (1024 x 1536) est posée en deux morceaux :
         . haut   = y    0 .. 587   (bandeau, titre, mention, logo Europe)
         . bas    = y 1314 .. 1535  (signature et vague tricolore)
       Entre les deux, la zone vide de l'affiche (y 588..1314, blanche sur
       toute la largeur) devient une plage blanche EXTENSIBLE qui accueille
       le formulaire : il s'affiche donc en entier, sans ascenseur interne,
       quelle que soit la taille de l'écran.
       L'image n'est encodée qu'une seule fois, dans la variable --affiche.
       ------------------------------------------------------------------ */
    .affiche {
      display: block; width: 100%; background: white;
      box-shadow: 0 10px 34px rgba(20, 45, 80, .16);
    }
    .affiche .haut, .affiche .bas {
      width: 100%;
      background-image: var(--affiche);
      background-repeat: no-repeat;
      background-size: 100% auto;
    }
    .affiche .haut { aspect-ratio: 1024 / 588; background-position: center top; }
    .affiche .bas  { aspect-ratio: 1024 / 222; background-position: center bottom; }
    .affiche .zone {
      background: white;
      padding: 0 3% 1.5%;        /* la zone vide est occupée sur toute sa largeur utile */
    }
    .affiche .zone iframe {
      display: block; width: 100%; height: 760px;
      border: 0; background: transparent;
    }

    @media (max-width: 480px) {
      body { padding: 68px 6px 12px; }
      .back-button { top: 10px; right: 10px; padding: 10px 14px; font-size: 14px; }
      .affiche .zone { padding: 0 2% 2%; }
    }
    @media print {
      body { padding: 0; background: white; }
      .back-button { display: none; }
      main { width: 100%; }
      .affiche { box-shadow: none; }
    }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="retourPageAppel()" aria-label="Retour à la page d'appel">
    <span aria-hidden="true">←</span> Retour
  </button>
  <main>
    <div class="affiche" role="img"
         aria-label="Contact Comité de Jumelage Belleville-en-Beaujolais et Salzkotten — toutes les rubriques sont obligatoires">
      <div class="haut"></div>
      <div class="zone">
        <iframe id="formulaireCDJ"
                title="Formulaire de contact du Comité de Jumelage"
                src="https://form.jotform.com/262192300967357"
                scrolling="auto"
                allow="geolocation; microphone; camera; fullscreen"></iframe>
      </div>
      <div class="bas"></div>
    </div>
  </main>
  <script>
    function retourPageAppel() {
      if (window.history.length > 1) {
        window.history.back();
      } else if (document.referrer) {
        window.location.href = document.referrer;
      } else {
        window.location.href = "/";
      }
    }

    /* Jotform annonce la hauteur réelle du formulaire ; on y ajuste le cadre
       pour qu'il s'affiche en entier. Si le message n'arrive pas, la hauteur
       par défaut (760 px) et l'ascenseur du cadre prennent le relais. */
    (function () {
      var cadre = document.getElementById("formulaireCDJ");
      window.addEventListener("message", function (e) {
        if (!/^https:\/\/([a-z0-9-]+\.)?jotform\.com$/.test(e.origin)) return;
        if (typeof e.data !== "string") return;
        var bouts = e.data.split(":");
        if (bouts[0] !== "setHeight") return;
        var h = parseInt(bouts[1], 10);
        if (h > 0) { cadre.style.height = h + "px"; }
      }, false);
    })();
  </script>
</body>
</html>
